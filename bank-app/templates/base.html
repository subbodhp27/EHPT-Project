<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}NexaBank{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --gold:#C9A84C; --gold-light:#E8C87A; --dark:#0A0C10; --dark2:#111318; --dark3:#181C23; --border:rgba(201,168,76,0.18); --text:#E8E6E0; --muted:#8A8880; --red:#E05252; --green:#4CAF82; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--dark); color:var(--text); min-height:100vh; }
.bg-pattern { position:fixed; inset:0; z-index:0; background:radial-gradient(ellipse at 20% 50%,rgba(201,168,76,0.04) 0%,transparent 60%),linear-gradient(135deg,#0A0C10,#0D1117); }
.bg-grid { position:fixed; inset:0; z-index:0; background-image:linear-gradient(rgba(201,168,76,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,0.03) 1px,transparent 1px); background-size:60px 60px; }
nav { position:fixed; top:0; left:0; right:0; z-index:100; background:rgba(10,12,16,0.92); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:0 40px; height:70px; display:flex; align-items:center; justify-content:space-between; }
.nav-logo { display:flex; align-items:center; gap:12px; }
.nav-logo-icon { width:36px; height:36px; border-radius:8px; background:linear-gradient(135deg,var(--gold),var(--gold-light)); display:flex; align-items:center; justify-content:center; font-size:18px; }
.nav-logo-text { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; color:var(--gold); }
.nav-links { display:flex; gap:28px; }
.nav-links a { color:var(--muted); text-decoration:none; font-size:14px; font-weight:500; transition:color 0.2s; }
.nav-links a:hover, .nav-links a.active { color:var(--gold); }
.nav-right { display:flex; gap:12px; align-items:center; }
.btn-outline { padding:8px 20px; border:1px solid var(--border); background:transparent; color:var(--text); border-radius:8px; cursor:pointer; font-size:14px; text-decoration:none; transition:all 0.2s; }
.btn-outline:hover { border-color:var(--gold); color:var(--gold); }
.btn-gold { padding:8px 20px; background:linear-gradient(135deg,var(--gold),var(--gold-light)); color:#0A0C10; border:none; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; text-decoration:none; display:inline-block; }
.main-content { position:relative; z-index:1; padding-top:70px; }
.panel { background:var(--dark2); border:1px solid var(--border); border-radius:16px; padding:28px; }
.form-group { margin-bottom:20px; }
.form-label { display:block; font-size:13px; font-weight:500; color:var(--muted); margin-bottom:8px; }
.form-input { width:100%; padding:12px 16px; background:var(--dark3); border:1px solid var(--border); border-radius:10px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:15px; outline:none; transition:all 0.2s; }
.form-input:focus { border-color:var(--gold); }
.form-input::placeholder { color:var(--muted); }
.btn-primary { width:100%; padding:14px; background:linear-gradient(135deg,var(--gold),var(--gold-light)); color:#0A0C10; border:none; border-radius:10px; cursor:pointer; font-size:15px; font-weight:700; font-family:'DM Sans',sans-serif; }
.alert { padding:14px 18px; border-radius:10px; margin-bottom:16px; font-size:14px; }
.alert-danger  { background:rgba(224,82,82,0.1);   border:1px solid rgba(224,82,82,0.3);   color:var(--red); }
.alert-warning { background:rgba(201,168,76,0.1);  border:1px solid rgba(201,168,76,0.3);  color:var(--gold); }
.alert-success { background:rgba(76,175,130,0.1);  border:1px solid rgba(76,175,130,0.3);  color:var(--green); }
.toast-container { position:fixed; top:90px; right:20px; z-index:999; display:flex; flex-direction:column; gap:12px; }
.toast { background:var(--dark2); border:1px solid var(--border); border-radius:12px; padding:16px 20px; min-width:300px; display:flex; align-items:flex-start; gap:12px; box-shadow:0 8px 32px rgba(0,0,0,0.4); animation:slideIn 0.3s ease; }
@keyframes slideIn { from{ transform:translateX(100%); opacity:0; } to{ transform:translateX(0); opacity:1; } }
.toast.t-danger  { border-left:3px solid var(--red); }
.toast.t-warning { border-left:3px solid var(--gold); }
.toast.t-success { border-left:3px solid var(--green); }
</style>
{% block extra_css %}{% endblock %}
</head>
<body>
<div class="bg-pattern"></div>
<div class="bg-grid"></div>
<div class="toast-container" id="toastContainer"></div>
<nav>
  <div class="nav-logo">
    <div class="nav-logo-icon">🏦</div>
    <div class="nav-logo-text">NexaBank</div>
  </div>
  <div class="nav-links">
    <a href="/" class="{% if request.endpoint=='home' %}active{% endif %}">Home</a>
    {% if session.user %}
    <a href="/dashboard" class="{% if request.endpoint=='dashboard' %}active{% endif %}">Dashboard</a>
    <a href="/profile"   class="{% if request.endpoint=='profile' %}active{% endif %}">Profile</a>
    {% endif %}
  </div>
  <div class="nav-right">
    {% if session.user %}
      <span style="font-size:14px;color:var(--muted)">👤 {{ session.name }}</span>
      <a href="/logout" class="btn-outline">Logout</a>
    {% else %}
      <a href="/login"    class="btn-outline">Login</a>
      <a href="/register" class="btn-gold">Open Account</a>
    {% endif %}
  </div>
</nav>
<div class="main-content">{% block content %}{% endblock %}</div>
<script>
function showToast(title, msg, type) {
  type = type || 'danger';
  var icons = { danger:'🚨', warning:'⚠️', success:'✅' };
  var t = document.createElement('div');
  t.className = 'toast t-' + type;
  t.innerHTML = '<span style="font-size:18px">' + (icons[type]||'ℹ️') + '</span><div><div style="font-size:13px;font-weight:600;margin-bottom:4px">' + title + '</div><div style="font-size:12px;color:var(--muted)">' + msg + '</div></div><span onclick="this.parentElement.remove()" style="margin-left:auto;cursor:pointer;color:var(--muted)">✕</span>';
  document.getElementById('toastContainer').appendChild(t);
  setTimeout(function() { if(t.parentElement) t.remove(); }, 6000);
}
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
